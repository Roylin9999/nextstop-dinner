<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14302b">
<title>我們，下一站一起走</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 溫暖、真誠、像老朋友的晚餐，不是業績會議
   IDEA: 一條「下一站」捷運路線圖 + 一張張車票，五個階段就是五個站
   PICTURE: 頂部大幅路線圖，小列車停在目前這一站；抽卡是翻面的車票
   COLOUR and TYPE: 深森林綠夜色底、米白紙票、珊瑚色重點；Noto Serif TC 標題 + Noto Sans TC 內文
   LAYOUT: 投影用：路線圖 → 左大舞台 + 右側計時與 QR；手機自動直排 */
:root{color-scheme:dark;--bg:#14302b;--bg2:#1b3d37;--line:#2c5249;--paper:#f7f0e3;--paper2:#efe4cf;--ink:#1c2422;--ink2:#5b6560;--cream:#f4ecdc;--mute:#a9c1b8;--coral:#ff7b5c;--coral2:#ffb199;--gold:#f2c86b}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--cream);font:16px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;overflow-x:clip;min-height:100vh;
 background-image:radial-gradient(1200px 500px at 85% -10%,#2a5a50 0,transparent 60%),radial-gradient(900px 500px at -10% 110%,#21463f 0,transparent 60%)}
h1,h2,h3,.serif{font-family:"Noto Serif TC","Songti TC",serif;letter-spacing:.01em}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hidden{display:none!important}
.wrap{max-width:1400px;margin:0 auto;padding:clamp(16px,2.4vw,32px) max(3vw,14px) 48px}
.btn{min-height:44px;border-radius:999px;padding:10px 20px;font-weight:700;border:1.5px solid transparent;background:var(--paper2);color:var(--ink);transition:transform .12s,background .15s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.coral{background:var(--coral);color:#2a120a}
.btn.coral:hover{background:#ff8f74}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--cream)}
.btn.ghost:hover{background:var(--bg2)}
.btn.ink{background:var(--ink);color:var(--paper)}
.btn.sm{min-height:38px;padding:7px 14px;font-size:14px}

/* 標題與路線圖 */
.top{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap}
.top h1{font-size:clamp(32px,4.2vw,52px);line-height:1.08;margin:0;font-weight:900;text-wrap:balance}
.top p{margin:8px 0 0;color:var(--mute)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;color:var(--mute);white-space:nowrap}
.chip b{color:var(--gold);font-weight:700}
.metro{margin:26px 0 22px;position:relative;padding:8px 0 0}
.metro .rail{position:absolute;left:10%;right:10%;top:36px;height:8px;border-radius:8px;background:var(--line)}
.metro .rail i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--gold),var(--coral));transition:width .6s cubic-bezier(.3,.8,.3,1)}
.stops{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.stop{background:none;border:0;padding:0 4px;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--mute);min-height:44px}
.dot{width:44px;height:44px;border-radius:50%;background:var(--bg);border:4px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:15px;transition:.3s;position:relative}
.stop.done .dot{border-color:var(--gold);background:var(--gold);color:var(--ink)}
.stop.cur .dot{border-color:var(--coral);background:var(--paper);color:var(--ink);box-shadow:0 0 0 8px rgba(255,123,92,.18),0 0 30px rgba(255,123,92,.5)}
.stop .nm{font-weight:700;font-size:15px;line-height:1.3;text-align:center}
.stop .mn{font-size:13px;opacity:.75}
.stop.cur{color:var(--paper)}
.train{position:absolute;top:-30px;left:50%;transform:translateX(-50%);width:46px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,-3px)}}

/* 主版面 */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.stage{background:var(--paper);color:var(--ink);border-radius:26px;padding:clamp(20px,2.6vw,36px);position:relative;box-shadow:0 30px 60px -30px rgba(0,0,0,.55)}
.stage:before,.stage:after{content:"";position:absolute;top:118px;width:26px;height:26px;border-radius:50%;background:var(--bg)}
.stage:before{left:-13px}.stage:after{right:-13px}
.shead{display:flex;justify-content:space-between;gap:14px;align-items:start;border-bottom:2px dashed #d8cbb2;padding-bottom:20px;margin-bottom:24px;min-height:96px}
.shead small{color:var(--coral);font-weight:700;font-size:14px}
.shead h2{font-size:clamp(28px,3vw,40px);line-height:1.1;margin:4px 0 6px;font-weight:900}
.shead p{margin:0;color:var(--ink2)}
.mins{white-space:nowrap;background:var(--ink);color:var(--paper);border-radius:12px;padding:8px 14px;font-weight:700;font-size:14px}
.say{background:#fff8ea;border:1.5px solid #ecdcbc;border-radius:18px;padding:20px 22px;margin:16px 0}
.say small{display:block;color:#9a6b2f;font-weight:700;margin-bottom:6px}
.say q{quotes:"「" "」";font-family:"Noto Serif TC",serif;font-size:clamp(20px,2.2vw,28px);line-height:1.6;font-weight:600}
.lead h3{font-size:24px;margin:0 0 6px;line-height:1.3}
.lead p{margin:0;color:var(--ink2)}
.tip{color:var(--ink2);font-size:15px;margin:14px 0 0}
.sfoot{display:flex;justify-content:space-between;gap:12px;border-top:2px dashed #d8cbb2;margin-top:26px;padding-top:18px}

.moods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:20px 0}
.mood{background:#fffaf0;border:1.5px solid #ecdcbc;border-radius:20px;padding:18px 12px;text-align:center}
.mood svg{width:56px;height:56px}
.mood b{display:block;font-size:17px;margin:8px 0 2px}
.mood p{margin:0;color:var(--ink2);font-size:14px;min-height:44px}
.cnt{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:10px}
.cnt button{width:44px;height:44px;border-radius:50%;border:0;background:var(--paper2);font-size:20px;font-weight:700;color:var(--ink)}
.cnt strong{font-size:30px;font-variant-numeric:tabular-nums;min-width:1.6em}

/* 車票卡 */
.ticketbox{perspective:1400px}
.ticket{position:relative;min-height:300px;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.8,.3,1)}
.ticket.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;padding:28px 30px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;overflow:hidden}
.front{background:var(--bg);color:var(--cream);background-image:repeating-linear-gradient(135deg,transparent 0 18px,rgba(255,255,255,.03) 18px 36px)}
.back{transform:rotateY(180deg);background:linear-gradient(160deg,#1f4a42,#14302b);color:var(--paper)}
.face .no{font-size:14px;color:var(--gold);font-weight:700}
.face .q{font-family:"Noto Serif TC",serif;font-weight:900;font-size:clamp(24px,3vw,38px);line-height:1.45;margin:16px auto;max-width:720px;text-wrap:balance}
.face .cat{border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:5px 14px;font-size:14px}
.face:after{content:"";position:absolute;left:0;right:0;bottom:18px;border-top:2px dashed rgba(255,255,255,.14)}
.drawbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px}
.drawbar .left{color:var(--ink2)}
.drawbar .left b{color:var(--ink);font-size:20px}
.cats{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.cats span{background:var(--paper2);border-radius:999px;padding:4px 12px;font-size:14px}
.pips{display:flex;gap:5px;flex-wrap:wrap;margin-top:12px}
.pips i{width:16px;height:6px;border-radius:4px;background:#e2d5bd}
.pips i.on{background:var(--coral)}

.promise{border:2px solid #e3d3b4;border-radius:20px;padding:20px 24px;background:#fffaf0}
.promise div{padding:14px 0;border-bottom:2px dotted #d8c7a3;font-weight:700;font-size:17px}
.promise div:last-child{border:0}
.final{font-family:"Noto Serif TC",serif;font-size:clamp(19px,2vw,24px);line-height:1.9;font-weight:600;background:#fff8ea;border-left:6px solid var(--coral);border-radius:14px;padding:22px 26px;margin:0}

/* 右側 */
.side{display:grid;gap:16px;position:sticky;top:16px}
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:22px;padding:20px}
.panel h3{font-size:17px;margin:0 0 6px}
.clock{font-size:clamp(48px,5vw,64px);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;margin:4px 0 12px;color:var(--paper)}
.clock.over{color:var(--coral)}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:12px 0}
.bar i{display:block;height:100%;background:var(--gold);transition:width .4s}
.row{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;background:var(--bg);border-radius:999px;padding:4px;margin:10px 0}
.tabs button{flex:1;border:0;background:none;border-radius:999px;min-height:38px;font-size:14px;font-weight:700;color:var(--mute)}
.tabs button.on{background:var(--paper);color:var(--ink)}
.qr{background:var(--paper);border-radius:18px;padding:14px;aspect-ratio:1;display:grid;place-items:center;color:var(--ink);text-align:center;font-size:14px}
.qr svg{width:100%;height:100%}
.qlabel{text-align:center;font-weight:700;margin:12px 0 2px}
.qdetail{text-align:center;color:var(--mute);font-size:14px;margin:0 0 12px}
.small{font-size:13px;color:var(--mute);margin:10px 0 0}
.urlset{display:grid;gap:8px;margin-top:10px}
.urlset input{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:8px 12px;font-size:16px;width:100%}
.foot{text-align:center;color:var(--mute);font-size:14px;margin-top:26px}

/* 夥伴手機頁 */
.guest{max-width:640px;margin:0 auto;padding:28px 16px 48px}
.ghead{text-align:center;margin:12px 0 24px}
.ghead small{color:var(--gold);font-weight:700}
.ghead h1{font-size:clamp(32px,8vw,44px);line-height:1.1;margin:8px 0 8px;font-weight:900}
.ghead p{margin:0;color:var(--mute)}
.gpanel{background:var(--paper);color:var(--ink);border-radius:24px;padding:22px}
.gpanel h2{font-size:26px;margin:0 0 6px;line-height:1.25}
.gpanel .sub{color:var(--ink2);font-size:15px;margin:0}
.picks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:18px 0}
.pick{min-height:84px;border-radius:14px;border:0;background:var(--bg);color:var(--paper);font-size:24px;font-weight:700;font-family:"Noto Serif TC",serif;position:relative;overflow:hidden}
.pick:after{content:"";position:absolute;left:0;right:0;bottom:22px;border-top:1.5px dashed rgba(255,255,255,.18)}
.pick.mine{background:var(--coral);color:#2a120a}
.gq{background:linear-gradient(160deg,#1f4a42,#14302b);color:var(--paper);border-radius:20px;padding:30px 22px;text-align:center;min-height:300px;display:flex;flex-direction:column;justify-content:center;margin-top:14px;animation:rise .5s ease-out}
.gq small{color:var(--gold);font-weight:700}
.gq h2{font-size:clamp(25px,6.4vw,32px);line-height:1.55;margin:18px 0;font-weight:900;text-wrap:balance}
.gq p{margin:0;color:var(--mute);font-size:14px}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.field{display:block;font-weight:700;margin:16px 0 8px}
textarea{width:100%;min-height:90px;border-radius:14px;border:1.5px solid #e3d3b4;background:#fffaf0;padding:12px;font-size:16px;color:var(--ink);resize:vertical}
.priv{font-size:13px;color:var(--ink2);margin:14px 0 0}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--paper);color:var(--ink);font-weight:700;border-radius:999px;padding:12px 22px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:9;display:none}
.toast.show{display:block}

@media(max-width:1080px){.grid{grid-template-columns:minmax(0,1fr)}.side{position:static;grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){
 .side{grid-template-columns:minmax(0,1fr)}
 .stop .nm{font-size:13px}.stop .mn{display:none}.dot{width:36px;height:36px;font-size:13px}.metro .rail{top:32px}.train{width:36px;top:-24px}
 .moods{gap:8px}.mood{padding:12px 6px}.mood svg{width:40px;height:40px}.mood b{font-size:14px}.mood p{font-size:13px}
 .ticket{min-height:280px}.face{padding:22px 18px}
 .stage:before,.stage:after{display:none}
 .shead{flex-direction:column;min-height:0}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<!-- 主持人畫面 -->
<div id="host" class="wrap hidden">
 <header class="top">
  <div>
   <h1>我們，下一站一起走</h1>
   <p>老戰友真心話餐敘・讓故事被聽見，讓下一步更清楚</p>
  </div>
  <div class="chips"><span class="chip">今晚核心 <b>傾聽・連結・行動</b></span><span class="chip"><b>90</b> 分鐘</span><span class="chip"><b>17</b> 位夥伴</span></div>
 </header>
 <nav class="metro" aria-label="活動流程">
  <div class="rail"><i id="railFill"></i></div>
  <div class="stops" id="stops"></div>
 </nav>
 <div class="grid">
  <main class="stage">
   <div class="shead">
    <div><small id="sNo"></small><h2 id="sTitle"></h2><p id="sSub"></p></div>
    <span class="mins" id="sMins"></span>
   </div>
   <div id="sBody"></div>
   <div class="sfoot">
    <button class="btn" id="prev">← 上一站</button>
    <button class="btn ink" id="next">下一站 →</button>
   </div>
  </main>
  <aside class="side">
   <section class="panel">
    <h3>本站倒數</h3>
    <div class="clock" id="clock">25:00</div>
    <div class="row"><button class="btn coral sm" id="tgl">▶ 開始</button><button class="btn ghost sm" id="rst">↺ 重設</button><button class="btn ghost sm" id="fs">⛶ 全螢幕</button></div>
    <div class="bar"><i id="clockBar"></i></div>
    <p class="small">時間到不會自動換站，由主持人掌握節奏。</p>
   </section>
   <section class="panel">
    <h3>手機掃碼參加</h3>
    <div class="tabs" id="tabs"><button data-q="join" class="on">每人選卡</button><button data-q="current">當前題目</button></div>
    <div class="qr" id="qr"></div>
    <p class="qlabel" id="qLabel"></p>
    <p class="qdetail" id="qDetail"></p>
    <button class="btn ghost sm" id="copy" style="width:100%">複製手機連結</button>
    <details class="small" id="urlBox">
     <summary>設定公開網址（QR 要用）</summary>
     <div class="urlset">
      <input id="urlIn" type="url" inputmode="url" placeholder="貼上網站的公開網址 https://…">
      <button class="btn sm" id="urlSave">儲存網址</button>
     </div>
    </details>
   </section>
  </aside>
 </div>
 <p class="foot">為今晚準備的專屬互動網站・陪伴每個人的選擇，不以門票張數衡量信心</p>
</div>

<!-- 夥伴手機畫面 -->
<div id="guest" class="guest hidden">
 <div class="ghead">
  <small>老戰友的晚餐時光</small>
  <h1>我們，下一站一起走</h1>
  <p>每一個故事，都值得被好好聽見。</p>
 </div>
 <main class="gpanel" id="gBody"></main>
 <p class="foot">今晚願我們帶著理解離開，也帶著一點勇氣繼續前進。</p>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
{
/* ===== 可修改設定 CONFIG ===== */
const SITE_URL = 'https://roylin9999.github.io/nextstop-dinner/';  // 網站公開網址（例如 https://xxx.netlify.app/）。留空時：放在 Netlify 等一般網站會自動抓目前網址；也可在主持畫面右側「設定公開網址」貼上
const STEPS = [
 {t:'好好吃飯', s:'自由用餐', sub:'先放鬆，不急著進入活動。', m:25},
 {t:'心情溫度計', s:'輕鬆暖場', sub:'用一個手勢，說說今天聽完年會的感受。', m:10},
 {t:'老戰友真心話', s:'抽卡分享', sub:'17 張卡，從初心、現在到未來。每個人都可以真實回答。', m:35},
 {t:'給未來的約定', s:'一個小承諾', sub:'想一件未來 30 天可以做到的小事。', m:12},
 {t:'舉杯，再出發', s:'收尾合照', sub:'謝謝每一位仍願意坐在一起的夥伴。', m:8}
];
const QUESTIONS = [
 ['回到初心','當初決定開始經營美安，真正吸引你的是什麼？'],
 ['回到初心','剛開始經營時，有沒有一件讓你特別興奮的事？'],

 ['回到初心','如果能回到剛加入美安的那一天，你會對自己說什麼？'],
 ['看見現在','今天大會哪一句話或哪個觀念，最讓你有感？'],
 ['看見現在','這一年經營美安，讓你覺得最有成就感的是什麼？'],
 ['看見現在','最近有沒有一位客戶，讓你覺得自己的付出很值得？'],
 ['看見現在','經營這段時間，你覺得自己遇到最大的挑戰是什麼？'],

];
const ORDER = [6,0,13,9,3,16,11,5,1,14,8,4,12,2,10,7,15]; // 卡號 1~17 對應的題目（打散，讓相鄰卡號不同類別）
/* ============================ */

const DECK = ORDER.map(i=>({cat:QUESTIONS[i][0], q:QUESTIONS[i][1]}));
const KEY = 'nextstop_v2';
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = {get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let tt; const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2400)};
async function copy(text){try{await navigator.clipboard.writeText(text);toast('已複製')}catch(e){const a=document.createElement('textarea');a.value=text;document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}a.remove();toast(ok?'已複製':'請長按手動複製')}}

const TRAIN='<svg class="train" viewBox="0 0 48 30" aria-hidden="true"><rect x="2" y="2" width="44" height="22" rx="8" fill="#ff7b5c"/><rect x="8" y="7" width="10" height="8" rx="2" fill="#f7f0e3"/><rect x="21" y="7" width="10" height="8" rx="2" fill="#f7f0e3"/><rect x="34" y="7" width="7" height="8" rx="2" fill="#f7f0e3"/><rect x="2" y="17" width="44" height="3" fill="#c9563c"/><circle cx="13" cy="26" r="3" fill="#f2c86b"/><circle cx="35" cy="26" r="3" fill="#f2c86b"/></svg>';
const face=(mouth,brow)=>'<svg viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="30" r="27" fill="#f2c86b"/><circle cx="30" cy="34" r="27" fill="#e9b24f" opacity=".35"/><circle cx="21" cy="26" r="3.2" fill="#1c2422"/><circle cx="39" cy="26" r="3.2" fill="#1c2422"/>'+(brow||'')+'<path d="'+mouth+'" stroke="#1c2422" stroke-width="3.2" fill="none" stroke-linecap="round"/></svg>';
const MOODS=[
 [face('M19 37 Q30 48 41 37'),'1｜充滿期待','想趕快採取行動'],
 [face('M21 40 L39 38','<path d="M16 18 L25 20" stroke="#1c2422" stroke-width="3" stroke-linecap="round"/>'),'2｜正在思考','有啟發，但還在整理方向'],
 [face('M21 42 Q30 36 39 42','<path d="M17 20 L25 18 M35 18 L43 20" stroke="#1c2422" stroke-width="3" stroke-linecap="round"/>'),'3｜有點迷惘','想找到新的前進方式']
];

const params=new URLSearchParams(location.search);
const route=(location.hash.slice(1)||params.get('mode')||'');
const isGuest=/^(join|promise|card-\d+)$/.test(route)||(route==='card'&&params.get('n'));

if(isGuest) guest(); else host();

/* ---------- 主持人 ---------- */
function host(){
 $('#host').classList.remove('hidden');
 let st=Object.assign({step:0,drawn:[],cur:null,flip:false,q:'join',counts:[0,0,0],left:STEPS[0].m*60,run:false,url:''},ls.get(KEY,{}));
 st.run=false; let last=0;
 const save=()=>ls.set(KEY,st);

 function base(){
  if(st.url) return st.url;
  if(SITE_URL) return SITE_URL;
  const inFrame=(()=>{try{return window.top!==window.self}catch(e){return true}})();
  if(/^https?:$/.test(location.protocol)&&!inFrame) return location.origin+location.pathname;
  return '';
 }
 const link=h=>{const b=base();if(!b)return '';return b.split('#')[0]+'#'+h};

 function render(){
  const s=STEPS[st.step];
  $('#stops').innerHTML=STEPS.map((x,i)=>'<button class="stop '+(i<st.step?'done':i===st.step?'cur':'')+'" data-i="'+i+'">'+(i===st.step?TRAIN:'')+'<span class="dot">'+(i<st.step?'✓':i+1)+'</span><span class="nm">'+esc(x.t)+'</span><span class="mn">'+x.m+' 分鐘</span></button>').join('');
  $('#railFill').style.width=(st.step/4*100)+'%';
  $('#sNo').textContent='第 '+(st.step+1)+' 站・共 5 站';
  $('#sTitle').textContent=s.t; $('#sSub').textContent=s.sub; $('#sMins').textContent=s.m+' 分鐘';
  $('#prev').disabled=st.step===0; $('#next').disabled=st.step===4;
  $('#next').textContent=st.step===3?'完成約定 →':'下一站 →';
  $('#sBody').innerHTML=body(st.step);
  wire(); clock(); qr(); save();
 }

 function body(i){
  if(i===0) return '<div class="lead"><h3>今晚先不談績效，先好好吃頓飯。</h3><p>17 位老戰友坐在同一張餐桌前，就是值得珍惜的事。</p></div><div class="say"><small>開動前，主持人只需要說</small><q>今天辛苦了！我們先吃飯、聊聊天。等一下會用抽卡的方式，聽聽彼此的故事，不用準備標準答案。</q></div><p class="tip">主持提醒：讓大家自由用餐約 25 分鐘。這段時間不用主持、不用報告，也不用追問買票。</p>';
  if(i===1) return '<div class="lead"><h3>「今天的你，心情是哪一種？」</h3><p>請大家舉手比 1、2、3，再邀請 3～4 位夥伴分享原因。計數由主持人現場點選。</p></div><div class="moods">'+MOODS.map((m,j)=>'<div class="mood">'+m[0]+'<b>'+m[1]+'</b><p>'+m[2]+'</p><div class="cnt"><button data-m="'+j+'" data-d="-1" aria-label="減少一人">−</button><strong>'+st.counts[j]+'</strong><button data-m="'+j+'" data-d="1" aria-label="增加一人">＋</button></div></div>').join('')+'</div><div class="say"><small>主持人要說</small><q>沒有哪一種心情比較對。今天可以真實說出感受，我們一起聽。</q></div>';
  if(i===2){
   const c=st.cur===null?null:DECK[st.cur];
   return '<div class="lead"><h3>一人一題，讓每個人都被聽見。</h3><p>每人約 1～1.5 分鐘，可以略過或換題。想讓大家用手機看同一題，抽完按右側「當前題目」。</p></div>'
   +'<div class="ticketbox" style="margin-top:18px"><div class="ticket '+(c&&st.flip?'flip':'')+'" id="ticket">'
   +'<div class="face front"><span class="no">NEXT STOP</span><div class="q">每一張卡，<br>都是一段值得分享的故事。</div><span class="cat">按下方按鈕抽出卡片</span></div>'
   +'<div class="face back">'+(c?'<span class="no">第 '+String(st.cur+1).padStart(2,'0')+' 號卡</span><div class="q">'+esc(c.q)+'</div><span class="cat">'+esc(c.cat)+'</span>':'')+'</div>'
   +'</div></div>'
   +'<div class="drawbar"><div class="left">已抽 <b>'+st.drawn.length+'</b> / 17 張・抽過不重複</div><div class="row"><button class="btn" id="undo" '+(st.drawn.length?'':'disabled')+'>↶ 上一張</button><button class="btn coral" id="draw" '+(st.drawn.length>=17?'disabled':'')+'>'+(st.drawn.length?'抽下一張':'開始抽卡')+'</button></div></div>'
   +'<div class="pips">'+DECK.map((_,k)=>'<i class="'+(st.drawn.includes(k)?'on':'')+'"></i>').join('')+'</div>'
   +'<div class="cats"><span>回到初心 5 題</span><span>看見現在 6 題</span><span>走向未來 6 題</span></div>'
   +'<p class="tip">17 人都分享時，建議每人不超過 90 秒，主持人回應簡短即可。</p>';
  }
  if(i===3) return '<div class="lead"><h3>「我願意，從一件小事開始。」</h3><p>每人自己填一張卡，目標由自己選擇。掃右側 QR 可用手機填寫並複製保存。</p></div><div class="promise" style="margin-top:18px"><div>① 接下來 30 天，我想重新做好的一件事</div><div>② 我希望團隊怎麼支持我</div><div>③ 下一次年會，我希望自己能帶著什麼成果回來</div></div><div class="say"><small>主持提醒</small>邀請 3～5 位自願分享。可以提醒明天仍能依大會規則購票，但不用當場公開承諾張數，也不用以購票衡量對團隊的信任。</div>';
  return '<div class="lead"><h3>謝謝大家，還願意坐在同一張餐桌前。</h3><p>大家舉杯，跟身旁的夥伴說一句話，最後一起合照。</p></div><p class="final" style="margin-top:18px">「我知道這幾年和以前不太一樣。但今天最珍貴的，不是我們有多少人，而是我們還能坐在一起。<br><br>我們不用因為今晚感動，就急著做出任何決定。我更期待的是，從明天開始，每個人找到自己願意踏出的那一步。<br><br>很開心，今天我們還在這裡。下一站，我們一起走。」</p><p class="tip">最後任務：一起舉杯，拍一張 17 人的團體照，把今晚留作重新出發的紀念。</p>';
 }

 function wire(){
  document.querySelectorAll('.stop').forEach(b=>b.onclick=()=>go(+b.dataset.i));
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const j=+b.dataset.m;st.counts[j]=Math.max(0,st.counts[j]+(+b.dataset.d));render()});
  const d=$('#draw'); if(d) d.onclick=()=>{
   const rest=DECK.map((_,k)=>k).filter(k=>!st.drawn.includes(k)); if(!rest.length) return;
   const p=rest[Math.floor(Math.random()*rest.length)];
   st.drawn.push(p); st.cur=p; st.q='current'; st.flip=false; render();
   requestAnimationFrame(()=>requestAnimationFrame(()=>{st.flip=true;const t=$('#ticket');if(t)t.classList.add('flip');save()}));
  };
  const u=$('#undo'); if(u) u.onclick=()=>{st.drawn.pop();st.cur=st.drawn.length?st.drawn[st.drawn.length-1]:null;st.flip=st.cur!==null;render()};
 }

 function go(i){if(i<0||i>4)return;st.step=i;st.left=STEPS[i].m*60;st.run=false;render()}

 function clock(){
  const m=String(Math.floor(st.left/60)).padStart(2,'0'), s=String(st.left%60).padStart(2,'0');
  $('#clock').textContent=m+':'+s; $('#clock').classList.toggle('over',st.left===0);
  $('#tgl').textContent=st.run?'❚❚ 暫停':'▶ 開始';
  $('#clockBar').style.width=(100*(1-st.left/(STEPS[st.step].m*60)))+'%';
 }
 setInterval(()=>{if(!st.run)return;const now=Date.now();const d=Math.floor((now-last)/1000);if(d>0){last+=d*1000;st.left=Math.max(0,st.left-d);if(!st.left){st.run=false;toast('本站時間到了，依現場狀況決定是否前往下一站')}clock();save()}},400);

 function qr(){
  if(st.step!==2) st.q=st.step===3?'promise':'join'; else if(st.q==='promise') st.q='join';
  $('#tabs').classList.toggle('hidden',st.step!==2);
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.q===st.q));
  let h,lab,det;
  if(st.q==='promise'){h='promise';lab='寫給未來自己的約定';det='手機填寫，內容只留在自己的裝置上。'}
  else if(st.q==='current'){if(st.cur===null){h='';lab='請先抽出一張卡';det='抽卡後這裡會出現該題的 QR Code。'}else{h='card-'+(st.cur+1);lab='第 '+(st.cur+1)+' 號卡・當前題目';det='大家看到同一題；換題後請重新掃描。'}}
  else{h='join';lab='17 張卡・自己選一張';det='請大家約好選不同號碼，各自看到不同題目。'}
  const url=h?link(h):'';
  const box=$('#qr');
  if(!h) box.innerHTML='<div>先抽卡，<br>QR 就會出現</div>';
  else if(!url) box.innerHTML='<div>還沒有公開網址<br><small>網站發布後，貼到下方「設定公開網址」，QR 就會出現。</small></div>';
  else if(typeof qrcode==='function'){const q=qrcode(0,'M');q.addData(url);q.make();box.innerHTML=q.createSvgTag({cellSize:6,margin:2,scalable:true})}
  else box.innerHTML='<div style="word-break:break-all">'+esc(url)+'</div>';
  $('#qLabel').textContent=lab; $('#qDetail').textContent=det;
  $('#copy').disabled=!url; $('#copy').dataset.url=url;
  $('#urlBox').open=!base();
 }

 $('#prev').onclick=()=>go(st.step-1);
 $('#next').onclick=()=>go(st.step+1);
 $('#tgl').onclick=()=>{st.run=!st.run;last=Date.now();clock();save()};
 $('#rst').onclick=()=>{st.left=STEPS[st.step].m*60;st.run=false;clock();save()};
 $('#fs').onclick=()=>{try{if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>toast('此視窗不支援全螢幕'));else document.exitFullscreen()}catch(e){toast('此視窗不支援全螢幕')}};
 document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{st.q=b.dataset.q;qr();save()});
 $('#copy').onclick=()=>{if($('#copy').dataset.url)copy($('#copy').dataset.url)};
 $('#urlIn').value=st.url||SITE_URL||'';
 $('#urlSave').onclick=()=>{const v=$('#urlIn').value.trim();if(v&&!/^https?:\/\//.test(v)){toast('網址要以 https:// 開頭');return}st.url=v;save();qr();toast(v?'已儲存，QR 已更新':'已清除')};
 render();
}

/* ---------- 夥伴手機 ---------- */
function guest(){
 $('#guest').classList.remove('hidden');
 const g=$('#gBody');
 let mine=null; try{mine=JSON.parse(sessionStorage.getItem('pick')||'null')}catch(e){}
 const card=n=>{const c=DECK[n-1];if(!c){g.innerHTML='<h2>找不到這張卡</h2><p class="sub">請重新掃描主持人的 QR Code。</p>';return}
  g.innerHTML='<p class="sub">第 '+n+' 號卡・'+esc(c.cat)+'</p><div class="gq"><small>老戰友真心話</small><h2>'+esc(c.q)+'</h2><p>用 1～1.5 分鐘說說你的故事；也可以選擇略過。</p></div><div style="text-align:center;margin-top:16px"><button class="btn" id="back">↶ 回到選卡</button></div>';
  $('#back').onclick=join};
 function join(){
  g.innerHTML='<h2>選一張屬於你的真心話卡</h2><p class="sub">先跟身邊夥伴約好不同的號碼，再點開自己的卡。</p><div class="picks">'+DECK.map((_,i)=>'<button class="pick '+(mine===i+1?'mine':'')+'" data-n="'+(i+1)+'" aria-label="第 '+(i+1)+' 號卡">'+String(i+1).padStart(2,'0')+'</button>').join('')+'</div><p class="priv">沒有對錯。各手機之間看不到別人選了哪個號碼。</p>';
  g.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{mine=+b.dataset.n;try{sessionStorage.setItem('pick',mine)}catch(e){}card(mine)});
 }
 function promise(){
  const L=['接下來 30 天，我想重新做好的一件事','我希望團隊怎麼支持我','下一次年會，我希望帶著什麼成果回來'];
  const P=['例如：每週聯繫三位老朋友，關心他們的近況','例如：一起規劃一次有溫度的小聚會','例如：帶著更清楚的方向和一個新的合作故事'];
  g.innerHTML='<h2>寫給未來自己的約定</h2><p class="sub">不用交給任何人，這張卡留給你自己。</p>'+L.map((l,i)=>'<label class="field" for="a'+i+'">'+'①②③'[i]+' '+l+'</label><textarea id="a'+i+'" placeholder="'+P[i]+'"></textarea>').join('')+'<button class="btn coral" id="cp" style="width:100%;margin-top:10px">複製我的約定</button><p class="priv">不會傳給主持人或任何伺服器。按下複製後，貼到自己的備忘錄保存。</p>';
  [0,1,2].forEach(i=>{const t=$('#a'+i);try{t.value=sessionStorage.getItem('a'+i)||''}catch(e){}t.oninput=()=>{try{sessionStorage.setItem('a'+i,t.value)}catch(e){}}});
  $('#cp').onclick=()=>copy('我的下一站｜30 天約定\n'+[0,1,2].map(i=>'①②③'[i]+' '+L[i]+'：'+$('#a'+i).value).join('\n'));
 }
 const m=route.match(/^card-(\d+)$/);
 if(m) card(+m[1]); else if(route==='card') card(+params.get('n')); else if(route==='promise') promise(); else if(mine) card(mine); else join();
}
}
</script>
</body>
</html>
